    note: >-
      18th edition, part of the inaugural ACM Sustainability Week and
      co-located with ACM FCRC 2027. Two submission rounds, fall and winter;
      the fall round is recommended for authors facing long visa processing.
      Each HotCRP site opens three weeks before its deadline. Full papers are
      up to 10 pages and Notes papers up to 4 pages (9-point ACM sigconf,
      double-column, excluding references and appendices), double-blind. Full
      papers may be accepted, rejected or asked to revise; the camera-ready
      version gets one extra page. Authors choose one of four tracks (Control
      and energy systems, Learning, Systems and applied modeling, Theory).
      Selected rejected full papers may be invited as Notes papers. Papers
      rejected in the fall round may not be resubmitted in the winter round.
      Accepted papers from both rounds must be presented in June 2027.
      Proceedings are open access; authors from institutions outside ACM Open
      pay a subsidised APC of $250 (ACM/SIG members) or $350. The ACM Digital
      Library publication date, which matters for patent filings, may be up to
      two weeks before the conference. Notification dates state no time or
      timezone.
