name: EIRES Energizing Day
full_name: Energizing Day of the Eindhoven Institute for Renewable Energy Systems
kind: event
link: https://www.tue.nl/en/research/institutes/eindhoven-institute-for-renewable-energy-systems
society:
  - Other
frequency: annual
tags:
  - energy-storage
