description: >-
  The yearly day of the Eindhoven Institute for Renewable Energy Systems
  (EIRES) at TU Eindhoven: talks on the energy transition, research pitches
  and short poster presentations by PhD candidates, and time for networking.
  Free, and open to anyone interested in energy storage and conversion.

