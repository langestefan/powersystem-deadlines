name: CDC
full_name: IEEE Conference on Decision and Control
link: https://ieeecss.org/conferences/conference-decision-and-control
society:
  - IEEE CSS
frequency: annual
tags:
  - control
description: >-
  The flagship conference of the IEEE Control Systems Society, covering control
  theory and its applications. Power and energy systems are a regular topic,
  from grid stability and frequency control to distributed energy resources.

