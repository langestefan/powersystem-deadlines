name: Deploy

on:
  push:
    branches: [main]
  # Daily rebuild. The "next 7 days" grouping and the archive split are decided
  # at build time, so without this a deadline that passes overnight keeps its
  # old heading until the next commit.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Never let two deploys race for the gh-pages branch.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Publishing to the root of gh-pages clears the branch, and any open pull
      # request keeps its preview in preview/ on that same branch. Carry those
      # over into this build's output so they survive the deploy.
      - name: Keep open pull request previews
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null \
            && git cat-file -e FETCH_HEAD:preview 2>/dev/null; then
            git archive FETCH_HEAD preview | tar -x -C dist
            echo "Kept: $(ls dist/preview | tr '\n' ' ')"
          else
            echo "No previews to keep."
          fi

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.event.head_commit.message || github.sha }}'
          # TODO: uncomment once the custom domain's DNS points here, and update
          # SITE_URL in src/lib/site.ts to match. Setting a domain you do not own
          # breaks the github.io URL, so this stays off until then.
          # cname: powersystem-deadlines.org
