name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Schema errors in conferences/*.yml fail here.
      - name: Validate conference data
        run: npm run validate

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Catches anything the schema cannot: broken references, bad endpoints.
      - name: Build
        run: npm run build
