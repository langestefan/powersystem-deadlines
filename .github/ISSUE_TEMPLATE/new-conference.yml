name: Add a conference
description: Report a power system conference that is not listed yet.
title: 'Add: '
labels: [new-conference]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep this list current.

        If you are comfortable with a pull request, adding the YAML file yourself
        is faster. Copy [`_TEMPLATE.yml`](../blob/main/src/data/conferences/_TEMPLATE.yml)
        and see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). Otherwise fill this
        in and someone will open the PR for you.

  - type: input
    id: name
    attributes:
      label: Conference name
      description: The short name people use, plus the year.
      placeholder: ISGT Europe 2027
    validations:
      required: true

  - type: input
    id: full_name
    attributes:
      label: Full name
      placeholder: IEEE PES Innovative Smart Grid Technologies Conference Europe
    validations:
      required: true

  - type: input
    id: cfp_url
    attributes:
      label: Call for papers URL
      description: The official page the dates below come from. Required, because every date must be traceable.
      placeholder: https://example.org/call-for-papers
    validations:
      required: true

  - type: textarea
    id: deadlines
    attributes:
      label: Deadlines
      description: >-
        One per line, copied from the call for papers, with the timezone if it
        states one. Include notification and camera-ready dates if you have them.
      placeholder: |
        Abstract submission: 2027-01-15 23:59:59 AoE
        Full paper submission: 2027-02-01 23:59:59 AoE
        Author notification: 2027-04-15
        Final paper: 2027-05-20
      render: text
    validations:
      required: true

  - type: input
    id: dates
    attributes:
      label: Conference dates
      placeholder: October 19-22, 2027
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: City and country
      placeholder: Budapest, Hungary
    validations:
      required: true

  - type: dropdown
    id: society
    attributes:
      label: Organised by
      multiple: true
      options:
        - IEEE PES
        - IEEE PELS
        - IEEE IAS
        - IEEE IES
        - IEEE VTS
        - IEEE ComSoc
        - CIGRE
        - CIRED
        - IET
        - EPE
        - ACM
        - PSCC
        - VDE ETG
        - Other
    validations:
      required: true

  - type: dropdown
    id: tags
    attributes:
      label: Topics
      description: Pick everything that genuinely applies. These drive the filters and the per-topic calendar feeds.
      multiple: true
      options:
        - power-systems
        - power-electronics
        - machines-drives
        - smart-grid
        - microgrids
        - protection-automation
        - hvdc-facts
        - distribution
        - transmission
        - energy-markets
        - renewables
        - energy-storage
        - ev-transportation
        - power-quality
        - reliability-planning
        - computation-optimization
        - cyber-physical-security
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - in-person
        - hybrid
        - online
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Abstract-first submission, journal special issue, proceedings venue,
        anything a submitter should know.
    validations:
      required: false
